[tool.poetry]
name = "ml-iris-production"
version = "0.1.0"
description = "Учебный production-oriented ML-проект классификации ирисов"
authors = ["Ruslan <rs.xdms@gmail.com>"]
readme = "README.md"
packages = [{ include = "iris_classifier", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pandas = "^2.2.3"
scikit-learn = "^1.5.2"
joblib = "^1.4.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
ruff = "^0.7.3"
mypy = "^1.13.0"
pre-commit = "^4.0.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
]
ignore = [
    "E501",
]

[tool.ruff.lint.isort]
known-first-party = ["iris_classifier"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra -q"

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["iris_classifier"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
ignore_missing_imports = true
